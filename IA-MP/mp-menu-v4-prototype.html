<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP 菜单 v4 · 交互原型（转入/转出 · 数币优先）</title>
<style>
  :root{
    --brand:#7b5cfa; --brand-dark:#6544e8; --brand-soft:#f2eeff;
    --ink:#20222b; --muted:#8b8f9c; --line:#ebedf2; --canvas:#f6f7fa;
    --success:#16a673; --danger:#e45151; --sidebar:212px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--canvas);font-size:13px}
  button,select,input{font:inherit;outline:none}
  button{cursor:pointer}
  a{color:var(--brand);text-decoration:none}

  /* ---------- sidebar ---------- */
  .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);overflow-y:auto;background:#fff;border-right:1px solid var(--line);z-index:30}
  .brand{height:56px;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--line)}
  .brand-mark{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;color:#fff;font-weight:800;font-size:12px;background:linear-gradient(145deg,#9b83ff,#6544e8)}
  .brand-name{font-size:14px;font-weight:750}
  .brand-name small{display:block;color:#a3a7b3;font-size:9px;font-weight:500;letter-spacing:.5px}
  .nav{padding:10px 9px 40px}
  .nav-group{margin-bottom:12px}
  .group-title{display:flex;align-items:center;gap:6px;padding:0 9px;margin:0 0 3px;color:var(--brand);font-size:10.5px;font-weight:700}
  .group-title::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .nav-link{width:100%;min-height:34px;display:flex;align-items:center;gap:9px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:#5b606d;text-align:left;font-size:12.5px}
  .nav-link:hover{color:var(--brand);background:#f8f6ff}
  .nav-link.active{color:var(--brand);background:var(--brand-soft);font-weight:650}
  .nav-icon{width:15px;text-align:center;font-size:12px;opacity:.85}

  /* ---------- shell ---------- */
  .main{min-height:100vh;margin-left:var(--sidebar)}
  .topbar{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:14px;padding:0 22px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
  .crumb{color:var(--muted);font-size:12.5px}
  .crumb b{color:var(--ink);font-weight:600}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pick{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px}
  select.pick-sel{height:30px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:11.5px}
  .avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#262a35;color:#fff;font-size:11px;font-weight:700}
  .content{padding:18px 22px 60px}
  .page-title{margin:0 0 14px;font-size:19px;letter-spacing:-.3px}

  .tabbar{display:flex;gap:24px;border-bottom:1px solid var(--line)}
  .tab{position:relative;padding:0 0 10px;border:0;background:transparent;color:#6b7080;font-size:13.5px}
  .tab:hover{color:var(--brand)}
  .tab.active{color:var(--brand);font-weight:650}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}
  .subtabbar{display:flex;gap:8px;margin-top:14px}
  .subtab{height:28px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:#fff;color:#6b7080;font-size:11.5px}
  .subtab:hover{color:var(--brand);border-color:#cfc2ff}
  .subtab.active{color:#fff;border-color:var(--brand);background:var(--brand)}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:16px;margin-top:16px;align-items:start}
  .layout.full{grid-template-columns:minmax(0,1fr)}
  .card{background:#fff;border:1px solid var(--line);border-radius:11px}
  .pad{padding:18px 20px}
  .card h3{margin:0 0 4px;font-size:15px}
  .card .sub{margin:0 0 16px;color:var(--muted);font-size:12px;line-height:1.7}
  .rail-card{padding:16px 18px}
  .rail-card h4{margin:0 0 10px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--danger)}
  .rail-card h4.plain{color:var(--ink)}
  .tip{margin:0;padding:0;list-style:none;font-size:11.5px;line-height:1.85;color:#6b7080}
  .tip li{position:relative;padding-left:11px;margin-bottom:7px}
  .tip li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:#e0b0b0}
  .tip b{color:#4c515e}
  .rail-desc{margin:0 0 12px;color:var(--muted);font-size:11.5px;line-height:1.7}
  .btn-ghost{width:100%;height:32px;border:1px solid var(--brand);border-radius:7px;background:#fff;color:var(--brand);font-size:12px}

  /* ---------- form bits ---------- */
  .banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid #f4e2bd;border-radius:8px;background:#fffaf0;color:#8a6a2a;font-size:11.5px;line-height:1.7;margin-bottom:18px}
  .banner a{margin-left:auto;white-space:nowrap}
  .label{margin:0 0 8px;font-size:12.5px;font-weight:600}
  .row-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .row-label .link{font-size:11.5px}
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
  .opt-grid.three{grid-template-columns:repeat(3,1fr)}
  .opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left}
  .opt:hover{border-color:#cfc2ff}
  .opt.on{border-color:var(--brand);box-shadow:0 0 0 3px #7b5cfa12}
  .opt strong{font-size:12.5px}
  .opt small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
  .coin{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:10px;font-weight:800;background:#26a17b}
  .coin.usdc{background:#2775ca}
  .coin.usd{background:#e8e9ee;color:#41454f}
  .coin.eur{background:#e8e9ee;color:#41454f}
  .chip-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;font-weight:600}
  .chip.on{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 3px #7b5cfa12}
  .field{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px;background:#fff}
  .field:focus-within{border-color:#b7a6ff;box-shadow:0 0 0 3px #7b5cfa12}
  .field input{flex:1;height:40px;padding:0 13px;border:0;background:transparent}
  .field .suffix{display:flex;align-items:center;gap:7px;padding:0 13px;border-left:1px solid var(--line);background:#fafbfc;font-size:12px;font-weight:600}
  .helper{display:flex;gap:12px;margin:0 0 18px;color:var(--muted);font-size:11.5px}
  .helper .link{color:var(--brand)}
  .select{width:100%;height:40px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238b8f9c' stroke-width='1.4'/></svg>") no-repeat right 13px center;color:#6b7080;appearance:none;margin-bottom:18px;text-align:left}
  .select.green{background-color:#f4fbf7;border-color:#d5ecdf}
  .rate-line{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:#5b606d;font-size:12px}
  .swap{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--brand)}
  .rate-line .fee{color:var(--muted);font-size:11.5px}
  .summary{padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:#fbfbfd;margin-bottom:18px}
  .summary-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:#6b7080}
  .summary-row b{color:var(--ink);font-weight:600}
  .summary-row.total b{color:var(--brand)}
  .btn-primary{width:100%;height:42px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:600}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-primary.soft{background:#b9a5ff}
  .convert{display:flex;gap:10px;padding:12px 14px;border:1px dashed var(--brand);border-radius:9px;background:#faf8ff;color:#5d5378;font-size:11.5px;line-height:1.8;margin-bottom:18px}
  .convert b{color:var(--brand-dark)}

  /* ---------- va / list ---------- */
  .va-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .va{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .va-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
  .va-bank{flex:1;font-size:12px;font-weight:650;line-height:1.5}
  .tag{padding:2px 7px;border-radius:5px;background:var(--brand-soft);color:var(--brand);font-size:10px;font-weight:650;white-space:nowrap}
  .tag.gray{background:#f0f1f5;color:#8b8f9c}
  .tag.green{background:#eaf8f3;color:#16a673}
  .tag.blue{background:#eaf1fd;color:#3a72c8}
  .tag.off{background:#f7f8fa;color:#b4b8c2;text-decoration:line-through}
  .caps{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .caps-k{color:#a8adb9;font-size:10px;margin-right:2px;line-height:16px}
  .va-acct{padding:8px 10px;border-radius:7px;background:#f7f8fa;font-size:12px;letter-spacing:.5px;margin-bottom:8px}
  .va-meta{color:var(--muted);font-size:11px;line-height:1.8}
  .list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .list-head .acts{display:flex;gap:14px;font-size:11.5px}

  /* ---------- filters + table ---------- */
  .filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 18px}
  .filters .f{display:flex;flex-direction:column;gap:6px}
  .filters label{color:#6b7080;font-size:11.5px}
  .filters input,.filters select{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#6b7080;font-size:12px}
  .filter-acts{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}
  .btn-sm{height:30px;padding:0 14px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#6b7080;font-size:12px}
  .btn-sm.primary{border-color:var(--brand);background:var(--brand);color:#fff}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  th,td{height:46px;padding:0 16px;border-bottom:1px solid #f2f3f6;text-align:left;font-size:12px}
  th{height:38px;color:#8b8f9c;background:#fafbfc;font-weight:600}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fbfaff}
  .table-wrap{overflow-x:auto}
  .badge{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:600}
  .badge.gray{background:#f0f1f5;color:#7c818e}
  .ok{color:var(--success);font-weight:600}
  .pos{color:var(--success);font-weight:650}
  .neg{color:#e45151;font-weight:650}
  .empty{display:grid;place-items:center;min-height:280px;color:#a8adb9;font-size:12.5px}
  .empty div{text-align:center}
  .empty .ico{font-size:34px;opacity:.35;margin-bottom:10px}

  /* ---------- assets ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .stat{padding:16px 18px}
  .stat .k{color:var(--muted);font-size:11.5px}
  .stat .v{margin-top:10px;font-size:21px;font-weight:750;letter-spacing:-.4px}
  .stat .d{margin-top:6px;color:var(--muted);font-size:11px}
  .quick{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px}
  .qbtn{height:34px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#4f5360;font-size:12.5px}
  .qbtn:hover{color:var(--brand);border-color:#cfc2ff;background:#faf9ff}
  .qbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .sec-title{display:flex;align-items:center;gap:6px;margin:22px 0 10px;font-size:12.5px;font-weight:650}
  .sec-title::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .sec-title:first-child{margin-top:16px}
  .acct-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .acct{padding:18px 20px}
  .acct-head{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:650}
  .acct-bal{margin:14px 0 16px;font-size:26px;font-weight:750;letter-spacing:-.5px}
  .acct-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .acct-btns button{height:32px;border-radius:7px;border:1px solid var(--line);background:#fff;color:#5b606d;font-size:12.5px}
  .acct-btns button.fill{border-color:transparent;background:var(--brand-soft);color:var(--brand);font-weight:600}
  .acct-btns button:hover{border-color:#cfc2ff;color:var(--brand)}
  .acct-meta{padding-top:12px;border-top:1px solid var(--line)}
  .acct-meta div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted);font-size:11.5px}
  .acct-meta b{color:#4c515e;font-weight:600}
  .note{margin-top:14px;padding:11px 14px;border:1px solid #ece7ff;border-radius:9px;background:#faf8ff;color:#6b6480;font-size:11.5px;line-height:1.85}
  .note b{color:var(--brand-dark)}
  .sub-inline{color:var(--muted);font-size:11px}
  /* 卡片栏格：小屏 2 列，大屏 3 / 4 列 */
  @media(min-width:1500px){.va-grid,.acct-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(min-width:1920px){.va-grid,.acct-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media(max-width:1180px){.layout{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:820px){.va-grid,.acct-grid{grid-template-columns:minmax(0,1fr)}}
  @media(max-width:760px){.sidebar{transform:translateX(-100%)}.main{margin-left:0}}
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">E</div><div class="brand-name">MP Console<small>MENU v4 · CRYPTO FIRST</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="top-right">
        <div class="pick"><span>业务形态</span>
          <select class="pick-sel" id="profile">
            <option value="full">数币＋法币（全业务）</option>
            <option value="fiat">只做法币业务</option>
            <option value="otc">只做承兑（同名进 → 承兑 → 同名出）</option>
          </select>
        </div>
        <div class="avatar">KL</div>
      </div>
    </header>
    <div class="content">
      <h1 class="page-title" id="pageTitle"></h1>
      <div class="tabbar" id="tabbar"></div>
      <div class="subtabbar" id="subtabbar"></div>
      <div id="stage"></div>
      <div class="note" id="note"></div>
    </div>
  </main>
<script>
(() => {
/* =============== 通用片段 =============== */
const rail = (tips, extra='') => `<aside>
  <div class="card rail-card"><h4>● 重要提示</h4><ul class="tip">${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>
  ${extra}</aside>`;
const railCard = (title, desc, btn) => `<div class="card rail-card" style="margin-top:14px"><h4 class="plain">${title}</h4><p class="rail-desc">${desc}</p><button class="btn-ghost">${btn}</button></div>`;
const filters = (fs) => `<div class="card"><div class="filters">${fs.map(f=>`<div class="f"><label>${f}</label>${f.includes('日期')?'<input type="date">':(f.includes('类型')||f.includes('状态')||f.includes('币种')?'<select><option>全部</option></select>':'<input placeholder="请输入">')}</div>`).join('')}</div><div class="filter-acts"><button class="btn-sm">重置</button><button class="btn-sm primary">查询</button><button class="btn-sm">导出</button></div></div>`;
const table = (cols, rows) => `<div class="card table-wrap" style="margin-top:14px"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const empty = (t='暂无数据') => `<div class="card empty"><div><div class="ico">▤</div>${t}</div></div>`;
const listPage = (fs, cols, rows) => `<div class="layout full">${filters(fs)}${rows.length?table(cols,rows):empty()}</div>`;

/* =============== 页面内容 =============== */
/* --- 转入 · 数币地址 --- */
const inCrypto = `<div class="layout">
  <section class="card pad">
    <div class="list-head"><div><h3 style="margin:0 0 4px">数币转入地址</h3><p class="sub" style="margin:0">选择币种与网络，获取专属链上地址。所有链上转入共用同一地址。</p></div><div class="acts"><a href="#">数币地址簿</a></div></div>
    <p class="label">币种</p>
    <div class="opt-grid" data-group="coin">
      <button class="opt on"><span class="coin">T</span><span><strong>USDT</strong><small>Tether</small></span></button>
      <button class="opt"><span class="coin usdc">C</span><span><strong>USDC</strong><small>USD Coin</small></span></button>
    </div>
    <p class="label">网络</p>
    <div class="opt-grid" data-group="net">
      <button class="opt on"><span class="coin" style="background:#6c7cf0">E</span><span><strong>Ethereum (ERC-20)</strong><small>Ethereum Network</small></span></button>
      <button class="opt"><span class="coin" style="background:#e33a3a">T</span><span><strong>Tron (TRC-20)</strong><small>Tron Network</small></span></button>
    </div>
    <button class="btn-primary">显示地址</button>
  </section>
  ${rail([
    '<b>网络要求：</b>务必通过对应网络发送所选加密资产（Ethereum 请用 ERC-20，TRON 请用 TRC-20）。跨网络转账将导致资产永久丢失。',
    '<b>地址确认：</b>发送前请再次核对充值地址，地址错误或智能合约转账均不受理。',
    '<b>来源地址：</b>请在地址簿中把发币地址勾上<b>转入来源</b>并完成核验，否则可能延迟入账。',
    '<b>确认时间：</b>ERC-20 需 64 个确认（约 20-30 分钟），TRC-20 需 19 个确认（约 1-2 分钟）。',
    '<b>联系支持：</b>请联系您的客户经理或邮件联系 support@ex.com'
  ], railCard('数币地址簿','一个地址只需添加一次，勾选「转入来源」即可用于来账核验，同时可勾「转出」作提币目标。','去维护'))}
</div>`;

/* --- 入金 · 收款账户（法币，含原收款工具） --- */
const vaCard = (kind,name,acct,bank,cur,st,ownName,caps) => `<div class="va">
  <div class="va-top"><span class="tag${kind==='机构大账户'?' blue':''}">${kind}</span><span class="va-bank">${name}</span><span class="tag green">${st}</span></div>
  <div class="va-acct">**** **** **** ${acct}</div>
  <div class="va-meta">▣ ${bank}<br>户名：${ownName}&nbsp;&nbsp;·&nbsp;&nbsp;地区：SG&nbsp;&nbsp;·&nbsp;&nbsp;<span class="tag gray">${cur}</span></div>
  <div class="caps"><span class="caps-k">可用能力</span>${caps.map(c=>`<span class="tag ${c[1]?'green':'off'}">${c[0]}</span>`).join('')}</div></div>`;
const inFiat = `<div class="layout">
  <section class="card pad">
    <div class="list-head"><div><h3 style="margin:0 0 4px">银行转入账户</h3><p class="sub" style="margin:0">仅展示当前可用的账户。</p></div><div class="acts"><a href="#">查看不可用账户（2）</a><a href="#">＋ 申请账户</a></div></div>
    <p class="label">币种</p>

const state={profile:'full',item:'in',tab:0};
const groups=()=>buildMenu(state.profile).filter(g=>!g.req||PROFILES[state.profile].includes(g.req));
const allItems=()=>groups().flatMap(g=>g.items.map(i=>({...i,group:g.title||''})));

function renderNav(){
  nav.innerHTML=groups().map(g=>`<div class="nav-group">${g.title?`<div class="group-title">${g.title}</div>`:''}
    ${g.items.map(i=>`<button class="nav-link${state.item===i.key?' active':''}" data-key="${i.key}"><span class="nav-icon">${i.icon}</span><span>${i.label}</span></button>`).join('')}</div>`).join('');
  nav.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>{state.item=b.dataset.key;state.tab=0;renderNav();render();});
}
function bindChoices(){
  stage.querySelectorAll('.opt-grid').forEach(g=>g.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{g.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));o.classList.add('on');}));
  stage.querySelectorAll('.chip-row').forEach(g=>g.querySelectorAll('.chip').forEach(o=>o.onclick=()=>{g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));o.classList.add('on');}));
}
function render(){
  const item=allItems().find(i=>i.key===state.item);
  if(!item)return;
  document.getElementById('pageTitle').textContent=item.label;
  document.getElementById('crumb').innerHTML=`${item.group?item.group+' / ':''}<b>${item.label}</b>`;
  const tabs=item.tabs||[];
  tabbar.innerHTML=tabs.map((t,i)=>`<button class="tab${i===state.tab?' active':''}" data-i="${i}">${t.label}</button>`).join('');
  tabbar.style.display=tabs.length>1?'flex':'none';
  tabbar.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=+b.dataset.i;render();});
  subtabbar.style.display='none';
  stage.innerHTML=tabs.length?tabs[state.tab].html:'';
  noteEl.innerHTML=item.note||''; noteEl.style.display=item.note?'block':'none';
  bindChoices(); window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('profile').onchange=e=>{
  state.profile=e.target.value;
  const keys=allItems().map(i=>i.key);
  if(!keys.includes(state.item))state.item=keys[0];
  state.tab=0;renderNav();render();
};
