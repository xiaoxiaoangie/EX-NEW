<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP 菜单结构 v4 · 菜单与 Tab 框架</title>
<style>
  :root{
    --brand:#7b5cfa; --brand-dark:#6544e8; --brand-soft:#f2eeff;
    --ink:#20222b; --muted:#8b8f9c; --line:#ebedf2; --canvas:#f6f7fa; --sidebar:210px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--canvas)}
  button,select{font:inherit;cursor:pointer}

  .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);overflow-y:auto;background:#fff;border-right:1px solid var(--line);z-index:30}
  .brand{height:60px;display:flex;align-items:center;gap:9px;padding:0 18px;border-bottom:1px solid var(--line)}
  .brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;color:#fff;font-weight:800;font-size:13px;background:linear-gradient(145deg,#9b83ff,#6544e8)}
  .brand-name{font-size:15px;font-weight:750;letter-spacing:-.2px}
  .brand-name small{display:block;margin-top:1px;color:#a3a7b3;font-size:9px;font-weight:500;letter-spacing:.6px}

  .nav{padding:12px 10px 30px}
  .nav-group{margin-bottom:14px}
  .group-title{display:flex;align-items:center;gap:6px;padding:0 10px;margin:0 0 4px;color:var(--brand);font-size:11px;font-weight:700;letter-spacing:.3px}
  .group-title::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .nav-link{width:100%;min-height:36px;display:flex;align-items:center;gap:9px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:#5b606d;text-align:left;font-size:13px;transition:.15s}
  .nav-link:hover{color:var(--brand);background:#f8f6ff}
  .nav-link.active{color:var(--brand);background:var(--brand-soft);font-weight:650}
  .nav-icon{width:16px;text-align:center;font-size:13px;opacity:.85}
  .nav-flag{margin-left:auto;padding:1px 5px;border-radius:4px;background:#f0f1f5;color:#9aa0ad;font-size:9px;font-weight:600}

  .main{min-height:100vh;margin-left:var(--sidebar)}
  .topbar{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:14px;padding:0 24px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
  .crumb{color:var(--muted);font-size:13px}
  .crumb b{color:var(--ink);font-weight:600}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .profile-pick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  select{height:32px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:12px;outline:none}
  select:focus{border-color:#b7a6ff;box-shadow:0 0 0 3px #7b5cfa14}
  .avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#262a35;color:#fff;font-size:11px;font-weight:700}

  .content{padding:22px 24px 60px}
  .page-title{margin:0 0 16px;font-size:20px;letter-spacing:-.3px}

  .tabbar{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:0}
  .tab{position:relative;padding:0 0 11px;border:0;background:transparent;color:#6b7080;font-size:14px}
  .tab:hover{color:var(--brand)}
  .tab.active{color:var(--brand);font-weight:650}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}

  .subtabbar{display:flex;gap:8px;margin:16px 0 0}
  .subtab{height:30px;padding:0 13px;border:1px solid var(--line);border-radius:99px;background:#fff;color:#6b7080;font-size:12px}
  .subtab:hover{color:var(--brand);border-color:#cfc2ff}
  .subtab.active{color:#fff;border-color:var(--brand);background:var(--brand)}

  .stage{margin-top:18px;min-height:340px;display:grid;place-items:center;border:1px dashed #d8dae2;border-radius:12px;background:#fff;text-align:center;padding:40px 24px}
  .stage-key{display:inline-block;margin-bottom:10px;padding:4px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:650;letter-spacing:.3px}
  .stage h2{margin:0 0 8px;font-size:17px}
  .stage p{margin:0;color:var(--muted);font-size:13px;line-height:1.8;max-width:520px}
  .stage .path{margin-top:14px;color:#a8adb9;font-size:12px}

  .note{margin-top:16px;padding:12px 14px;border:1px solid #ece7ff;border-radius:10px;background:#faf8ff;color:#6b6480;font-size:12px;line-height:1.8}
  .note b{color:var(--brand-dark)}

  @media(max-width:760px){
    .sidebar{transform:translateX(-100%)}
    .main{margin-left:0}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">E</div>
      <div class="brand-name">MP Console<small>MENU FRAME v4</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="top-right">
        <div class="profile-pick">
          <span>租户方案</span>
          <select id="profile">
            <option value="full">全能型（收付＋兑换＋卡＋收单）</option>
            <option value="otc">承兑型（只做数法兑换）</option>
            <option value="card">卡业务型</option>
            <option value="payment">支付收单型</option>
          </select>
        </div>
        <div class="avatar">KL</div>
      </div>
    </header>

    <div class="content">
      <h1 class="page-title" id="pageTitle"></h1>
      <div class="tabbar" id="tabbar"></div>
      <div class="subtabbar" id="subtabbar"></div>
      <section class="stage">
        <div>
          <span class="stage-key" id="stageKey"></span>
          <h2 id="stageTitle"></h2>
          <p id="stageDesc"></p>
          <div class="path" id="stagePath"></div>
        </div>
      </section>
      <div class="note" id="note"></div>
    </div>
  </main>

<script>
(() => {
  const MENU = [
    { items: [ { key:'dashboard', label:'仪表盘', icon:'◫', tabs:[] } ] },
    { title:'资产', items:[
      { key:'assets', label:'我的资产', icon:'◈',
        desc:'总余额 + 法币/数币分账户余额；卡片上直接挂「入金 / 兑换 / 出金」快捷按钮，90% 场景不用进二级菜单。',
        tabs:[ {label:'总览'}, {label:'法币账户'}, {label:'数币钱包'} ] },
      { key:'in', label:'入金', icon:'↓',
        desc:'原「充值 / 充币 / 收款工具」三处合一。入金本质是被动收钱——给对方一个账号即可，不存在「发起」动作，所以只有账号和记录两个 Tab。',
        tabs:[
          { label:'入金账号', sub:['同名 VA（充值用）','机构大账户（三方收款用）','数币充值地址（充币用）','申请记录'] },
          { label:'入金记录', sub:['全部','同名充值','三方收款','充币'] }
        ],
        note:'<b>VA 去重</b>：原「充值 › 充值法币」Tab 与「收款工具」页展示的是同一批 VA，此处合并为唯一入口「入金账号」。同名 VA 与机构大账户的区别只是<b>汇款人是不是自己</b>，系统靠汇款人匹配自动判定为充值或收款，商户不需要提前选。' },
      { key:'exchange', label:'兑换', icon:'⇄',
        desc:'数法兑换（OnRamp / OffRamp）和实时换汇（FX）合并为一个菜单，两个记录页也合并。放在入金与出金<b>中间</b>——钱进来 → 换成想要的 → 钱出去。',
        tabs:[ {label:'数法兑换'}, {label:'实时换汇'}, {label:'兑换记录', sub:['全部','数法兑换','实时换汇']} ],
        note:'兑换不是出金：兑换后钱仍在账户里，性质是<b>形态转换</b>。且 OnRamp / OffRamp 双向对称，挂在「出金」下只能容纳一半。' },
      { key:'out', label:'出金', icon:'↑',
        desc:'原「提现（到数币地址 / 到法币账户）」+「付款（到法币账户）」合并。同名（提现）还是三方（付款），由<b>选哪个收款人</b>决定，不再是两个菜单。',
        tabs:[
          { label:'出金到法币账户', sub:['同名账户（提现）','第三方账户（付款）'] },
          { label:'出金到数币地址', sub:['同名地址（提币）','第三方地址（付币）'] },
          { label:'出金记录', sub:['全部','提现/提币','付款/付币'] }
        ],
        note:'<b>单页完成</b>：出金页若余额币种与目标币种不符，在同页内嵌兑换预览（汇率＋到账金额＋一并执行），不要把客户甩去兑换页再走回来。' }
    ]},
    { title:'交易对手方', items:[
      { key:'counterparty', label:'对手方', icon:'◉',
        desc:'出金的目标名录。同名 / 第三方在列表内用标签区分，不拆菜单。',
        tabs:[ {label:'对手方账户（银行）', sub:['同名账户','第三方账户']}, {label:'对手方地址簿（链上）', sub:['同名地址','第三方地址']} ] }
    ]},
    { title:'卡业务', req:'card', items:[
      { key:'card-list', label:'卡片列表', icon:'▭', tabs:[{label:'全部'},{label:'虚拟卡'},{label:'实体卡'}] },
      { key:'card-order', label:'卡订单', icon:'▣', tabs:[{label:'消费'},{label:'退款'},{label:'ATM'}] },
      { key:'card-bill', label:'卡账单', icon:'≣', tabs:[{label:'账单周期'},{label:'账单明细'}] }
    ]},
    { title:'收单业务', req:'payment', items:[
      { key:'checkout', label:'支付单', icon:'▤', tabs:[{label:'收银台'},{label:'支付链接'},{label:'订阅'}] },
      { key:'settlement', label:'结算单', icon:'▦', tabs:[{label:'待结算'},{label:'已结算'}] },
      { key:'pay-refund', label:'退款单', icon:'↺', tabs:[{label:'退款申请'},{label:'退款记录'}] },
      { key:'pay-config', label:'支付配置', icon:'⚙', tabs:[{label:'收银台配置'},{label:'结算配置'}] }
    ]},
    { title:'报表中心', items:[
      { key:'report', label:'余额明细', icon:'▥', tabs:[{label:'法币'},{label:'数币'}] }
    ]},
    { title:'导出中心', items:[
      { key:'export', label:'我的导出', icon:'⇩', tabs:[] }
    ]},
    { title:'开发者中心', items:[
      { key:'api', label:'API 配置', icon:'{ }', tabs:[{label:'密钥管理'},{label:'Webhook'},{label:'IP 白名单'}] }
    ]},
    { title:'设置中心', items:[
      { key:'roles', label:'角色与权限', icon:'⚙', tabs:[{label:'成员'},{label:'角色'}] },
      { key:'agreement', label:'我的协议', icon:'▤', tabs:[] },
      { key:'security', label:'个人与安全', icon:'☗', tabs:[{label:'个人信息'},{label:'安全设置'}] }
    ]}
  ];

  const PROFILES = { full:['card','payment'], otc:[], card:['card'], payment:['payment'] };

  const nav = document.getElementById('nav');
  const tabbar = document.getElementById('tabbar');
  const subtabbar = document.getElementById('subtabbar');
  const state = { profile:'full', item:null, tab:0, sub:0 };

  const allItems = () => MENU.flatMap(g => g.items.map(i => ({...i, group:g.title || '', req:g.req})));

  function visibleGroups(){
    const allow = PROFILES[state.profile];
    return MENU.filter(g => !g.req || allow.includes(g.req));
  }

  function renderNav(){
    nav.innerHTML = visibleGroups().map(g => `
      <div class="nav-group">
        ${g.title ? `<div class="group-title">${g.title}</div>` : ''}
        ${g.items.map(i => `
          <button class="nav-link${state.item === i.key ? ' active' : ''}" data-key="${i.key}">
            <span class="nav-icon">${i.icon}</span><span>${i.label}</span>
            ${i.tabs && i.tabs.length ? `<span class="nav-flag">${i.tabs.length} Tab</span>` : ''}
          </button>`).join('')}
      </div>`).join('');
    nav.querySelectorAll('.nav-link').forEach(b => b.addEventListener('click', () => select(b.dataset.key)));
  }

  function current(){ return allItems().find(i => i.key === state.item); }

  function renderMain(){
    const item = current();
    if(!item) return;
    document.getElementById('pageTitle').textContent = item.label;
    document.getElementById('crumb').innerHTML = `${item.group ? item.group + ' / ' : ''}<b>${item.label}</b>`;

    const tabs = item.tabs || [];
    tabbar.innerHTML = tabs.map((t,i) => `<button class="tab${i===state.tab?' active':''}" data-i="${i}">${t.label}</button>`).join('');
    tabbar.style.display = tabs.length ? 'flex' : 'none';
    tabbar.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { state.tab = +b.dataset.i; state.sub = 0; renderMain(); }));

    const subs = (tabs[state.tab] && tabs[state.tab].sub) || [];
    subtabbar.innerHTML = subs.map((s,i) => `<button class="subtab${i===state.sub?' active':''}" data-i="${i}">${s}</button>`).join('');
    subtabbar.style.display = subs.length ? 'flex' : 'none';
    subtabbar.querySelectorAll('.subtab').forEach(b => b.addEventListener('click', () => { state.sub = +b.dataset.i; renderMain(); }));

    const tabLabel = tabs.length ? tabs[state.tab].label : '（无 Tab）';
    const subLabel = subs.length ? subs[state.sub] : '';
    document.getElementById('stageKey').textContent = item.key.toUpperCase();
    document.getElementById('stageTitle').textContent = subLabel ? `${tabLabel} · ${subLabel}` : tabLabel;
    document.getElementById('stageDesc').innerHTML = item.desc || '内容区留白：本原型只表达菜单与 Tab 结构，不含具体页面内容。';
    document.getElementById('stagePath').textContent =
      `路径：${item.group ? item.group + ' › ' : ''}${item.label}${tabs.length ? ' › ' + tabLabel : ''}${subLabel ? ' › ' + subLabel : ''}`;

    const note = document.getElementById('note');
    note.innerHTML = item.note || '';
    note.style.display = item.note ? 'block' : 'none';
  }

  function select(key){ state.item = key; state.tab = 0; state.sub = 0; renderNav(); renderMain(); }

  document.getElementById('profile').addEventListener('change', e => {
    state.profile = e.target.value;
    const keys = visibleGroups().flatMap(g => g.items.map(i => i.key));
    if(!keys.includes(state.item)) state.item = keys[0];
    renderNav(); renderMain();
  });

  select('in');
})();
</script>
</body>
</html>
